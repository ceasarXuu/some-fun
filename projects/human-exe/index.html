<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HUMAN.exe — 证明你不是 AI</title>
<meta name="description" content="30 秒证明你不是 AI。完成 6 个测试，看看你到底有多像人类。">
<meta name="theme-color" content="#0a0a0a">
<meta name="author" content="ceasarXuu">
<meta property="og:type" content="website">
<meta property="og:title" content="HUMAN.exe — Are You Human?">
<meta property="og:description" content="30 秒证明你不是 AI。完成测试，挑战我的 HUMAN 分数。">
<meta property="og:site_name" content="HUMAN.exe">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="HUMAN.exe — Are You Human?">
<meta name="twitter:description" content="30 秒证明你不是 AI。你能比我更像人类吗？">
<style>
  :root{
    --bg:#0a0a0a;
    --fg:#f3f3ee;
    --muted:#858585;
    --line:#2a2a2a;
    --acid:#dfff00;
    --red:#ff4d4d;
    --panel:#111;
    --shadow:0 30px 90px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;overflow:hidden}
  body{
    background:
      radial-gradient(circle at 50% -15%, rgba(223,255,0,.08), transparent 35%),
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
      var(--bg);
    background-size:auto,32px 32px,32px 32px,auto;
  }
  body:after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.18;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.025) 3px);
    mix-blend-mode:screen;
  }
  button{font:inherit}
  .app{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;position:relative}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;z-index:2}
  header{font-size:12px;letter-spacing:.12em;color:#aaa;text-transform:uppercase}
  .brand{color:var(--fg);font-weight:800}
  main{display:grid;place-items:center;min-height:0;padding:16px}
  .screen{width:min(760px,94vw);height:min(620px,76vh);min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center}
  .eyebrow{font-size:12px;letter-spacing:.18em;color:#858585;margin-bottom:18px;text-transform:uppercase}
  h1{font-size:clamp(44px,8vw,96px);line-height:.9;margin:0 0 26px;letter-spacing:-.07em}
  h2{font-size:clamp(24px,5vw,48px);line-height:1.02;margin:0 0 18px;letter-spacing:-.045em}
  .sub{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#a9a9a9;font-size:15px;line-height:1.6;max-width:540px;margin:0 auto 28px}
  .cta{border:1px solid var(--fg);background:var(--fg);color:#0b0b0b;padding:15px 24px;min-width:200px;cursor:pointer;transition:.16s;box-shadow:0 0 0 0 var(--acid);font-weight:900;letter-spacing:.08em}
  .cta:hover{transform:translateY(-2px);box-shadow:7px 7px 0 var(--acid)}
  .cta:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--acid)}
  .ghost{background:transparent;color:var(--fg);border-color:#444}
  .tiny{font-size:11px;color:#5f5f5f;margin-top:14px}
  .progress{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(520px,85vw);height:3px;background:#1f1f1f;overflow:hidden}
  .bar{height:100%;width:0;background:var(--acid);transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .round{position:absolute;top:25px;font-size:11px;color:#646464;letter-spacing:.16em}
  .prompt{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:clamp(22px,4vw,38px);font-weight:800;letter-spacing:-.04em;margin-bottom:24px;max-width:650px}
  .hint{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#797979;font-size:13px;margin-top:20px}
  .red-btn{width:112px;height:112px;border-radius:50%;border:0;background:var(--red);box-shadow:inset 0 -9px 0 rgba(0,0,0,.25),0 16px 50px rgba(255,77,77,.2);cursor:pointer;transition:.08s}
  .red-btn:active{transform:translateY(5px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
  .choices{display:grid;grid-template-columns:repeat(2,minmax(150px,220px));gap:14px;width:100%;justify-content:center}
  .choice{border:1px solid #383838;background:#111;color:#eee;padding:22px 18px;cursor:pointer;min-height:86px;transition:.14s;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
  .choice:hover{border-color:var(--acid);background:#171a0d}
  .choice .face{font-size:34px;margin-bottom:6px}
  .captcha{display:grid;grid-template-columns:repeat(3,94px);gap:7px;padding:9px;background:#171717;border:1px solid #2b2b2b}
  .tile{width:94px;height:82px;border:1px solid #2a2a2a;background:#101010;color:#d8d8d8;display:grid;place-items:center;cursor:pointer;position:relative;transition:.12s;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:13px}
  .tile.sel{outline:3px solid var(--acid);outline-offset:-3px;background:#1d200f}
  .captcha-actions{margin-top:12px;display:flex;justify-content:flex-end;width:296px}
  .small-btn{padding:10px 15px;border:0;background:var(--acid);color:#080808;font-weight:900;cursor:pointer}
  .arena{position:relative;width:min(560px,86vw);height:280px;border:1px solid #262626;background:rgba(255,255,255,.012);overflow:hidden}
  .target{position:absolute;width:58px;height:58px;border-radius:50%;background:var(--acid);box-shadow:0 0 30px rgba(223,255,0,.28);border:0;cursor:pointer;transition:left .16s cubic-bezier(.2,.8,.2,1),top .16s cubic-bezier(.2,.8,.2,1),transform .08s}
  .target:active{transform:scale(.8)}
  .timer{font-size:clamp(54px,11vw,110px);letter-spacing:-.08em;font-weight:900;font-variant-numeric:tabular-nums;margin:14px 0}
  .timer.hidden-digits{filter:blur(14px);opacity:.3}
  .stop{min-width:170px;border:1px solid var(--acid);background:transparent;color:var(--acid);padding:15px 22px;cursor:pointer;font-weight:800}
  .binary{display:flex;gap:16px}
  .binary button{width:160px;padding:18px;border:1px solid #393939;background:#111;color:#eee;cursor:pointer}
  .binary button:hover{border-color:var(--acid)}
  .flash{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:clamp(28px,6vw,58px);font-weight:900;letter-spacing:-.05em}
  .flash .accent{color:var(--acid)}
  .result-card{width:min(580px,92vw);background:#0d0d0d;border:1px solid #272727;padding:28px;text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .result-card:before{content:"HUMAN VERIFICATION / FINAL REPORT";position:absolute;top:11px;right:16px;color:#3b3b3b;font-size:9px;letter-spacing:.14em}
  .score-row{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #252525;padding-bottom:20px;margin-bottom:18px}
  .score{font-size:clamp(58px,11vw,96px);letter-spacing:-.09em;font-weight:950;line-height:.8}
  .score span{font-size:.35em;color:var(--acid);letter-spacing:-.02em}
  .verdict{text-align:right}
  .verdict b{display:block;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:17px}
  .verdict small{color:#686868}
  .meter{height:8px;background:#1a1a1a;margin:10px 0 22px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--acid);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px 26px;margin-bottom:20px}
  .stat{display:flex;justify-content:space-between;border-bottom:1px dashed #242424;padding:8px 0;font-size:12px}
  .stat span:first-child{color:#6f6f6f}
  .quote{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-weight:800;font-size:20px;line-height:1.25;margin:20px 0}
  .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .result-actions button{padding:13px;border:1px solid #3a3a3a;background:#151515;color:#eee;cursor:pointer;font-weight:800}
  .result-actions .primary{background:var(--acid);color:#090909;border-color:var(--acid)}
  .toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);background:#efefe9;color:#0b0b0b;padding:10px 14px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:120}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .scanline{position:absolute;left:0;right:0;height:90px;background:linear-gradient(transparent,rgba(223,255,0,.04),transparent);animation:scan 4s linear infinite;pointer-events:none}
  @keyframes scan{from{top:-120px}to{top:100%}}
  .glitch{animation:glitch .18s steps(2,end) 2}
  @keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-5px,2px)}50%{transform:translate(4px,-1px)}75%{transform:translate(-2px,-2px)}100%{transform:translate(0)}}
  .shake{animation:shake .22s linear}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .challenge-badge{
    display:inline-flex;align-items:center;gap:8px;border:1px solid #343434;
    background:#101010;padding:9px 12px;margin-bottom:18px;
    font-size:11px;letter-spacing:.08em;color:#aaa;
  }
  .challenge-badge b{color:var(--acid);font-size:14px}
  .versus{
    display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
    border:1px solid #262626;background:#0b0b0b;padding:12px 14px;margin:0 0 16px;
    font-size:11px;
  }
  .versus .vscore{font-size:20px;font-weight:950;color:var(--fg)}
  .versus .you{text-align:right}
  .versus .vs{color:#535353}
  .win{color:var(--acid)!important}
  .lose{color:var(--red)!important}
  .secondary-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .secondary-actions button{
    padding:11px;border:1px solid #2f2f2f;background:transparent;color:#9d9d9d;cursor:pointer;font-size:11px
  }
  .secondary-actions button:hover{color:var(--fg);border-color:#555}

  .creator{
    position:fixed;
    top:14px;
    right:18px;
    z-index:40;
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 11px 6px 6px;
    border:1px solid #2c2c2c;
    border-radius:999px;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(12px);
    color:#bdbdbd;
    text-decoration:none;
    transition:.16s;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  .creator:hover{
    border-color:#555;
    color:var(--fg);
    transform:translateY(-1px);
  }
  .creator img{
    width:28px;
    height:28px;
    border-radius:50%;
    display:block;
    object-fit:cover;
    border:1px solid #3b3b3b;
  }
  .creator-name{
    font-size:11px;
    font-weight:800;
    letter-spacing:.02em;
    color:var(--fg);
  }
  .creator-sep{color:#444;font-size:11px}
  .creator-github{font-size:10px;font-weight:800;letter-spacing:.04em;color:#7f7f7f}
  .creator:hover .creator-github{color:var(--acid)}

  @media(max-width:720px){
    .creator{top:9px;right:10px;padding:5px 10px 5px 5px;gap:7px}
    .creator img{width:25px;height:25px}
    .creator-name{font-size:10px}
    .creator-github{font-size:9px}
  }
  @media (max-width:600px){
    header{padding:16px}
    .screen{height:78vh;min-height:480px}
    .choices{grid-template-columns:1fr 1fr;gap:8px}
    .choice{min-width:0;padding:16px 8px}
    .captcha{grid-template-columns:repeat(3,82px)}
    .tile{width:82px;height:72px}
    .captcha-actions{width:260px}
    .result-card{padding:22px 18px}
    .stats{gap:6px 14px}
    .binary button{width:130px}
  }
</style>
</head>
<body>

<a class="creator" href="https://github.com/ceasarXuu/some-fun" target="_blank" rel="noopener noreferrer" aria-label="some-fun on GitHub">
  <img src="https://github.com/ceasarXuu.png?size=160" alt="ceasarXuu GitHub avatar">
  <span class="creator-name">ceasarXuu</span>
  <span class="creator-sep">·</span>
  <span class="creator-github">GitHub ↗</span>
</a>

<div class="app">
  <header>
    <div class="brand">HUMAN.exe</div>
  </header>

  <main>
    <section class="screen" id="screen">
      <div class="scanline"></div>
      <div class="eyebrow">human verification protocol // 2026</div>
      <h1>ARE YOU<br>HUMAN?</h1>
      <p class="sub">互联网已经无法确定。完成 6 个微型测试，用 30 秒证明你不是一个行为过于完美的 AI。</p>
      <button class="cta" id="startBtn">PROVE IT →</button>
      <div class="tiny">NO LOGIN · NO CAMERA · 30 SEC</div>
    </section>
  </main>
</div>

<div class="toast" id="toast">COPIED</div>

<script>
(() => {
  const GITHUB_URL = 'https://github.com/ceasarXuu/some-fun';
  const params = new URLSearchParams(location.search);
  const challengeScore = Number(params.get('challenge')) || null;
  const challengerId = (params.get('from') || '').slice(0, 12);

  const screen = document.getElementById('screen');
  const toast = document.getElementById('toast');
  const sid = Math.random().toString(16).slice(2,8).toUpperCase();

  const state = {
    round: 0,
    reaction: 0,
    judgement: 0,
    captcha: 0,
    chase: 0,
    timing: 0,
    final: 0,
    earlyClick: false,
    startedAt: 0
  };

  const roundShell = (n, inner) => `
    <div class="progress"><div class="bar" style="width:${((n-1)/6)*100}%"></div></div>
    <div class="round">TEST ${String(n).padStart(2,'0')} / 06</div>
    ${inner}
  `;

  const pause = ms => new Promise(r => setTimeout(r, ms));
  const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

  function bump(){
    if(navigator.vibrate) navigator.vibrate(18);
  }
  function glitch(){
    screen.classList.remove('glitch'); void screen.offsetWidth; screen.classList.add('glitch');
  }
  function say(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),1400);
  }

  function begin(){
    state.startedAt = performance.now();
    glitch();
    setTimeout(test1,180);
  }

  if (challengeScore) {
    screen.innerHTML = `
      <div class="scanline"></div>
      <div class="eyebrow">incoming human challenge</div>
      <div class="challenge-badge">CHALLENGER ${challengerId ? '#'+challengerId : ''} <b>${challengeScore}% HUMAN</b></div>
      <h1 style="font-size:clamp(48px,9vw,92px)">BEAT<br>${challengeScore}%</h1>
      <p class="sub">有人认为自己比你更像人类。完成同样的 6 个测试，拿结果说话。</p>
      <button class="cta" id="challengeStart">ACCEPT CHALLENGE →</button>
      <div class="tiny">NO LOGIN · SAME TEST FORMAT · 30 SEC</div>
    `;
    document.getElementById('challengeStart').onclick = begin;
  } else {
    document.getElementById('startBtn').onclick = begin;
  }

  function test1(){
    state.round=1;
    screen.innerHTML = roundShell(1, `
      <div class="prompt" id="t1prompt">不要点击红色按钮。</div>
      <button class="red-btn" id="red"></button>
      <div class="hint">这是一个服从性测试。</div>
    `);
    const red = document.getElementById('red');
    const p = document.getElementById('t1prompt');
    let go = false;
    let t0 = 0;
    red.onclick = () => {
      bump();
      if(!go){
        state.earlyClick = true;
        screen.classList.add('shake');
        p.textContent = '……我说了不要点。';
        setTimeout(()=>screen.classList.remove('shake'),250);
      }else{
        state.reaction = performance.now()-t0;
        red.disabled = true;
        p.innerHTML = `反应时间 <span style="color:var(--acid)">${Math.round(state.reaction)}ms</span>`;
        setTimeout(test2,650);
      }
    };
    setTimeout(()=>{
      go=true;
      p.textContent = '现在点。';
      t0=performance.now();
      red.style.boxShadow='0 0 0 7px rgba(223,255,0,.18),inset 0 -9px 0 rgba(0,0,0,.25)';
    },1700 + Math.random()*700);
  }

  function test2(){
    state.round=2;
    const start = performance.now();
    screen.innerHTML = roundShell(2, `
      <div class="prompt">哪一张脸“更像在强装开心”？</div>
      <div class="choices">
        <button class="choice" data-v="1"><div class="face">◡</div>A</button>
        <button class="choice" data-v="2"><div class="face">⌣</div>B</button>
      </div>
      <div class="hint">没有正确答案。犹豫本身就是答案。</div>
    `);
    document.querySelectorAll('.choice').forEach(btn=>{
      btn.onclick=()=>{
        const ms=performance.now()-start;
        state.judgement = clamp(100 - Math.abs(ms-1150)/18, 18, 100);
        btn.style.borderColor='var(--acid)';
        btn.innerHTML += `<div style="margin-top:8px;color:#8a8a8a;font-size:11px">${Math.round(ms)}ms hesitation</div>`;
        setTimeout(test3,600);
      };
    });
  }

  function test3(){
    state.round=3;
    const items=['前任','老板','妈妈','crush','披萨','银行','AI','猫','房东'];
    screen.innerHTML = roundShell(3, `
      <div class="prompt" style="font-size:26px">选出所有「凌晨 2 点发消息会后悔」的对象</div>
      <div class="captcha" id="cap">
        ${items.map((x,i)=>`<button class="tile" data-i="${i}">${x}</button>`).join('')}
      </div>
      <div class="captcha-actions"><button class="small-btn" id="verify">VERIFY</button></div>
    `);
    const selected=new Set();
    document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
      const i=+t.dataset.i;
      selected.has(i)?selected.delete(i):selected.add(i);
      t.classList.toggle('sel');
    });
    document.getElementById('verify').onclick=()=>{
      const chaotic = [0,1,3,8].filter(i=>selected.has(i)).length;
      const safePenalty = [2,4,6,7].filter(i=>selected.has(i)).length;
      state.captcha=clamp(52 + chaotic*11 - safePenalty*5 + (selected.has(5)?3:0),15,100);
      glitch();
      setTimeout(test4,420);
    };
  }

  function test4(){
    state.round=4;
    screen.innerHTML = roundShell(4, `
      <div class="prompt">点中圆点。很简单。</div>
      <div class="arena" id="arena"><button class="target" id="target"></button></div>
      <div class="hint" id="chaseHint">它大概不会逃。</div>
    `);
    const arena=document.getElementById('arena');
    const target=document.getElementById('target');
    let hits=0, moves=0;
    function move(){
      const maxX=arena.clientWidth-62, maxY=arena.clientHeight-62;
      target.style.left=(10+Math.random()*(maxX-20))+'px';
      target.style.top=(10+Math.random()*(maxY-20))+'px';
    }
    move();
    target.onclick=()=>{
      bump();
      hits++;
      if(hits<3){
        moves++;
        document.getElementById('chaseHint').textContent = hits===1?'好吧，它会逃。':'最后一次。真的。';
        move();
      }else{
        state.chase=clamp(88-moves*7 + Math.random()*8,40,98);
        target.style.transform='scale(1.5)';
        target.style.opacity='.15';
        setTimeout(test5,450);
      }
    };
    target.onmouseenter=()=>{
      if(hits<2 && Math.random()>.48){ moves++; move(); }
    };
  }

  function test5(){
    state.round=5;
    screen.innerHTML = roundShell(5, `
      <div class="prompt">在刚好 <span style="color:var(--acid)">3.000 秒</span>时停止计时</div>
      <div class="timer" id="timer">0.000</div>
      <button class="stop" id="stop">STOP</button>
      <div class="hint">2.7 秒后数字会消失。</div>
    `);
    const timer=document.getElementById('timer');
    const start=performance.now();
    let raf;
    function tick(){
      const sec=(performance.now()-start)/1000;
      timer.textContent=sec.toFixed(3);
      if(sec>2.7) timer.classList.add('hidden-digits');
      raf=requestAnimationFrame(tick);
    }
    tick();
    document.getElementById('stop').onclick=()=>{
      cancelAnimationFrame(raf);
      const val=(performance.now()-start)/1000;
      const diff=Math.abs(val-3);
      state.timing=clamp(100-diff*140,8,100);
      timer.classList.remove('hidden-digits');
      timer.textContent=val.toFixed(3);
      timer.style.color=diff<.05?'var(--acid)':'var(--fg)';
      document.getElementById('stop').disabled=true;
      document.querySelector('.hint').textContent = diff<.02?'DISTURBINGLY GOOD.': diff<.12?'非常像人类。':'时间感知存在轻微损坏。';
      setTimeout(test6,900);
    };
  }

  function test6(){
    state.round=6;
    screen.innerHTML = roundShell(6, `
      <div class="eyebrow">FINAL TEST</div>
      <div class="prompt">你是人类吗？</div>
      <div class="binary">
        <button data-v="yes">YES</button>
        <button data-v="no">NO</button>
      </div>
      <div class="hint">请诚实作答。</div>
    `);
    document.querySelectorAll('.binary button').forEach(b=>b.onclick=async()=>{
      state.final = b.dataset.v==='yes'?72:91;
      screen.innerHTML = roundShell(6, `<div class="flash">这正是 <span class="accent">AI</span><br>会说的话。</div>`);
      glitch();
      await pause(900);
      showResult();
    });
  }

  function showResult(){
    const reactionScore = clamp(100 - Math.abs(state.reaction-230)/5.4, 20, 100);
    const early = state.earlyClick ? 8 : 0;
    let score = Math.round(
      reactionScore*.23 +
      state.judgement*.13 +
      state.captcha*.18 +
      state.chase*.12 +
      state.timing*.24 +
      state.final*.10 + early
    );
    score=clamp(score,31,99);
    if(score===99 && Math.random()>.55) score=100;

    const chaos = clamp(Math.round((state.captcha + (state.earlyClick?94:48))/2),10,99);
    const obedience = state.earlyClick ? 12 : 74;
    const instinct = Math.round((reactionScore+state.timing)/2);
    const emotion = Math.round(state.judgement*.86 + 9);

    let title='CERTIFIED HUMAN', quote='你表现出了健康的不稳定性。';
    if(score<50){title='POSSIBLE NPC'; quote='你的人类证据……不太充分。';}
    else if(score<70){title='INTERNET USER'; quote='足够混乱，因此可信。';}
    else if(score<88){title='CERTIFIED HUMAN'; quote='可接受的人类误差。';}
    else if(score<97){title='EXTREMELY HUMAN'; quote='你的缺陷非常有说服力。';}
    else if(score<100){title='SUSPICIOUSLY HUMAN'; quote='过于像人类，反而值得怀疑。';}
    else {title='BOT DETECTED'; quote='完美的人类不存在。你露馅了。';}

    const percentile=clamp(Math.round(100 - (score-35)*1.25),1,87);
    const challenged = !!challengeScore;
    const won = challenged && score > challengeScore;
    const tied = challenged && score === challengeScore;
    const duelHeadline = !challenged ? '' :
      won ? 'YOU WON — challenger may be a bot.' :
      tied ? 'DRAW — statistically awkward.' :
      'YOU LOST — demand a rematch.';

    screen.innerHTML = `
      <div class="result-card">
        <div class="score-row">
          <div class="score">${score}<span>%</span></div>
          <div class="verdict"><b>${title}</b><small>TOP ${percentile}% OF HUMANS</small></div>
        </div>
        <div class="meter"><i id="meter"></i></div>

        ${challenged ? `
        <div class="versus">
          <div>
            <div style="color:#666">CHALLENGER</div>
            <div class="vscore">${challengeScore}%</div>
          </div>
          <div class="vs">VS</div>
          <div class="you">
            <div style="color:#666">YOU</div>
            <div class="vscore ${won ? 'win' : (!tied ? 'lose' : '')}">${score}%</div>
          </div>
        </div>
        <div style="font-size:11px;color:${won ? 'var(--acid)' : '#8b8b8b'};margin:-5px 0 16px">${duelHeadline}</div>
        ` : ''}

        <div class="stats">
          <div class="stat"><span>REACTION</span><b>${Math.round(state.reaction)}ms</b></div>
          <div class="stat"><span>INSTINCT</span><b>${instinct}%</b></div>
          <div class="stat"><span>EMOTION</span><b>${emotion}%</b></div>
          <div class="stat"><span>OBEDIENCE</span><b>${obedience}%</b></div>
          <div class="stat"><span>CHAOS</span><b>${chaos}%</b></div>
          <div class="stat"><span>SESSION</span><b>#${sid}</b></div>
        </div>
        <div class="quote">“${quote}”</div>
        <div class="result-actions">
          <button class="primary" id="share">${challenged && won ? 'EXPOSE THEM ON X' : 'CHALLENGE X'}</button>
          <button id="again">${challenged && !won ? 'REMATCH' : 'RUN AGAIN'}</button>
        </div>
        <div class="secondary-actions">
          <button id="copyResult">COPY RESULT</button>
          <button id="starResult">★ STAR SOME FUN</button>
        </div>
      </div>
    `;
    setTimeout(()=>document.getElementById('meter').style.width=score+'%',80);

    const cleanBase = location.origin + location.pathname;
    const challengeUrl = `${cleanBase}?challenge=${score}&from=${encodeURIComponent(sid)}`;
    const shareText = challenged
      ? (won
          ? `I beat ${challengeScore}% with ${score}% HUMAN on HUMAN.exe.\nApparently my challenger may be a bot.\nCan you beat me?`
          : `I got ${score}% HUMAN on HUMAN.exe.\nI couldn't beat ${challengeScore}% — can you?`)
      : `I got ${score}% HUMAN on HUMAN.exe — ${title}.\nCan you prove you're more human than me?`;

    document.getElementById('again').onclick=()=>location.href = cleanBase;

    document.getElementById('share').onclick=()=>{
      const intent = 'https://twitter.com/intent/tweet?text='
        + encodeURIComponent(shareText)
        + '&url=' + encodeURIComponent(challengeUrl);
      window.open(intent,'_blank','noopener,noreferrer,width=720,height=560');
    };

    document.getElementById('copyResult').onclick=async()=>{
      const copy = `${shareText}\n${challengeUrl}`;
      try{
        await navigator.clipboard.writeText(copy);
        say('RESULT + CHALLENGE LINK COPIED');
      }catch(e){
        say('COPY FAILED');
      }
    };

    document.getElementById('starResult').onclick=()=>{
      window.open(GITHUB_URL,'_blank','noopener,noreferrer');
    };
  }
})();
</script>
</body>
</html>
